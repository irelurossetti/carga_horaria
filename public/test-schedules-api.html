<!DOCTYPE html>
<html>
<head>
    <title>Test Schedules API</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 5px; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Test Schedules API</h1>
    
    <button onclick="testGetSchedules()">GET /api/schedules</button>
    <button onclick="testGetAssignments()">GET /api/assignments</button>
    <button onclick="testGetRooms()">GET /api/rooms</button>
    
    <h2>Response:</h2>
    <pre id="response">Click a button to test...</pre>
    
    <script>
        async function testGetSchedules() {
            try {
                const response = await fetch('/api/schedules', {
                    headers: { 'Accept': 'application/json' }
                });
                const data = await response.json();
                document.getElementById('response').textContent = JSON.stringify(data, null, 2);
                console.log('Schedules:', data);
            } catch (error) {
                document.getElementById('response').textContent = 'Error: ' + error.message;
                console.error(error);
            }
        }
        
        async function testGetAssignments() {
            try {
                const response = await fetch('/api/assignments', {
                    headers: { 'Accept': 'application/json' }
                });
                const data = await response.json();
                document.getElementById('response').textContent = JSON.stringify(data, null, 2);
                console.log('Assignments:', data);
            } catch (error) {
                document.getElementById('response').textContent = 'Error: ' + error.message;
                console.error(error);
            }
        }
        
        async function testGetRooms() {
            try {
                const response = await fetch('/api/rooms', {
                    headers: { 'Accept': 'application/json' }
                });
                const data = await response.json();
                document.getElementById('response').textContent = JSON.stringify(data, null, 2);
                console.log('Rooms:', data);
            } catch (error) {
                document.getElementById('response').textContent = 'Error: ' + error.message;
                console.error(error);
            }
        }
    </script>
</body>
</html>
